<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل دخول الإدارة</title>
  <link rel="stylesheet" href="layout.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .login-logo {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }
    .login-logo img {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <h2>بوابة الإدارة</h2>

    <div class="form-group" style="margin-bottom:16px;">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
    </div>

    <div class="form-group" style="margin-bottom:22px;">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
    </div>

    <div id="loginAlert"></div>

    <button id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;" onclick="handleLogin()">
      تسجيل الدخول
    </button>

    <div style="margin-top:18px;text-align:center;">
      <a href="index.html" style="font-size:13px;color:var(--neutral-500);">
        ← العودة لاستمارة الموظف
      </a>
    </div>

  </div>
</div>

<script>
  // ── Supabase init inline — guaranteed to run after CDN loads ──────
  const ROLE_PAGES = {
    nursing_dir:  "admin-nursing-dir.html",
    nursing_hosp: "admin-nursing-hosp.html",
    other_dir:    "admin-other-dir.html",
    other_hosp:   "admin-other-hosp.html",
    full:         "admin-full.html"
  };

  async function handleLogin() {
    const username = $("#username").val().trim();
    const password = $("#password").val();
    $("#loginAlert").html("");

    if (!username || !password) {
      $("#loginAlert").html('<div class="alert alert-danger">⚠️ يرجى إدخال اسم المستخدم وكلمة المرور.</div>');
      return;
    }

    const btn = $("#loginBtn");
    btn.html('<span class="spinner"></span> جارٍ التحقق...').prop("disabled", true);

    try {
      const { data, error } = await _supabase
        .from("admin_users")
        .select("*")
        .eq("username", username)
        .eq("password", password)
        .limit(1);

      if (error) throw error;

      if (data && data.length > 0) {
        const user = data[0];

        if (!ROLE_PAGES[user.role]) {
          $("#loginAlert").html('<div class="alert alert-danger">❌ هذا الحساب لا يملك صلاحية الدخول.</div>');
          return;
        }

        sessionStorage.setItem("admin_role", user.role);
        sessionStorage.setItem("admin_user", user.username);
        sessionStorage.setItem("admin_name", user.display_name || user.username);

        window.location.href = ROLE_PAGES[user.role];

      } else {
        $("#loginAlert").html('<div class="alert alert-danger">❌ اسم المستخدم أو كلمة المرور غير صحيحة.</div>');
      }

    } catch (err) {
      $("#loginAlert").html(`<div class="alert alert-danger">❌ خطأ في الاتصال: ${err.message}</div>`);
    } finally {
      btn.html("تسجيل الدخول").prop("disabled", false);
    }
  }

  $("#username, #password").on("keypress", function(e) {
    if (e.which === 13) handleLogin();
  });
</script>

</body>
</html>
